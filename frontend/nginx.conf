# Serves the compiled SPA and reverse-proxies the API to the backend container,
# so the browser sees a single origin (no CORS) and the SameSite=Lax session
# cookie works without extra configuration.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API. The /api prefix is preserved (no trailing slash on
    # proxy_pass), matching the backend's global `/api` prefix.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
